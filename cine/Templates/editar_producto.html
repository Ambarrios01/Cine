<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editar.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/Hollywood__3_-removebg-preview.png') }}" alt="CinePlus Logo">
        </div>        
        <ul class="nav-links">

            {% if 'user_id' in session and session['rol'] == 'administrativo' %}
            <li><a href="{{ url_for('listar_peliculas') }}">administrativo</a></li>
            <li><a href="{{ url_for('listar_peliculas') }}">Gestionar Películas</a></li>
            <li><a href="{{ url_for('gestionar_confiteria') }}">Gestionar Confitería</a></li>
            <li><a href="{{ url_for('gestionar_funciones') }}">Gestionar Funciones</a></li>
            <li><a href="{{ url_for('gestionar_salas') }}">Gestionar Salas</a></li>
            {% endif %}
        </ul>
    </nav>

    <div class="container">
        <h2>Editar Producto</h2>
        <form action="{{ url_for('editar_producto', id_producto=producto.id_producto) }}" method="POST">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}" required>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion" required>{{ producto.descripcion }}</textarea>

            <label for="precio">Precio:</label>
            <input type="number" step="0.01" id="precio" name="precio" value="{{ producto.precio }}" required>

            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" value="{{ producto.stock }}" required>

            <button type="submit">Guardar Cambios</button>
        </form>
        <br>
        <a class="volver" href="{{ url_for('gestionar_confiteria') }}">Volver a la lista</a>
    </div>
    
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
</body>
</html>
